name: Render vertical Shorts

# Native 9:16 Shorts: re-renders the episode's own 3D scenes in vertical framing (the scene code reads E.vertical)
# for each range listed in studio/projects/<project>/shorts.json, cuts the matching audio from the episode mix,
# adds the question on top and a "full video" banner at the end, and publishes them as a GitHub release.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Episode project in studio/projects (must contain shorts.json)"
        required: true
      only:
        description: "Optional: comma list of short names to render (default: all)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      pieces: ${{ steps.p.outputs.pieces }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, math
          S = json.load(open('studio/projects/${{ github.event.inputs.project }}/shorts.json'))
          only = [x for x in '${{ github.event.inputs.only }}'.split(',') if x]
          out = []
          for s in S:
              if only and s['name'] not in only: continue
              n = max(1, math.ceil((s['to'] - s['from']) / 6.0))
              for i in range(n):
                  a = round(s['from'] + i * (s['to'] - s['from']) / n, 3); b = round(s['from'] + (i + 1) * (s['to'] - s['from']) / n, 3)
                  out.append({'name': s['name'], 'i': i, 'from': a, 'to': b})
          print('pieces=' + json.dumps(out))
          PY

  audio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q numpy scipy
      - working-directory: studio
        run: mkdir -p projects/${{ github.event.inputs.project }}/build && python audio/mix.py --project projects/${{ github.event.inputs.project }}
      - uses: actions/upload-artifact@v4
        with: { name: mix, path: "studio/projects/${{ github.event.inputs.project }}/build/mix.wav", retention-days: 3 }

  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        piece: ${{ fromJSON(needs.plan.outputs.pieces) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - working-directory: studio
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Vertical copy of the project
        working-directory: studio/projects
        run: |
          cp -r ${{ github.event.inputs.project }} vproj
          python3 -c "import json;p='vproj/config.json';c=json.load(open(p));c['aspect']='9:16';json.dump(c,open(p,'w'))"
      - name: Render piece
        working-directory: studio
        run: node render.mjs --project projects/vproj --from ${{ matrix.piece.from }} --to ${{ matrix.piece.to }} --workers 2 --format jpeg --out "$GITHUB_WORKSPACE/p_${{ matrix.piece.name }}_${{ matrix.piece.i }}.mp4"
      - uses: actions/upload-artifact@v4
        with: { name: "piece-${{ matrix.piece.name }}-${{ matrix.piece.i }}", path: "p_*.mp4", retention-days: 3 }

  final:
    needs: [plan, render, audio]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with: { pattern: "piece-*", merge-multiple: true, path: pieces }
      - uses: actions/download-artifact@v4
        with: { name: mix, path: . }
      - name: Assemble Shorts
        run: |
          python3 - <<'PY'
          import json, glob, subprocess, os
          P = 'studio/projects/${{ github.event.inputs.project }}'; FONT = 'tools/Fredoka700.ttf'
          only = [x for x in '${{ github.event.inputs.only }}'.split(',') if x]
          os.makedirs('out', exist_ok=True)
          for s in json.load(open(P + '/shorts.json')):
              if only and s['name'] not in only: continue
              parts = sorted(glob.glob(f"pieces/p_{s['name']}_*.mp4"), key=lambda f: int(f.rsplit('_', 1)[1][:-4]))
              open('list.txt', 'w').write(''.join(f"file '{p}'\n" for p in parts))
              subprocess.run(['ffmpeg', '-y', '-v', 'error', '-f', 'concat', '-safe', '0', '-i', 'list.txt', '-c', 'copy', 'v.mp4'], check=True)
              d = s['to'] - s['from']; q = lambda t: t.replace("'", "’").replace(':', '\\:')
              vf = (f"drawtext=fontfile={FONT}:text='{q(s['q1'])}':fontsize=74:fontcolor=white:borderw=8:bordercolor=0x0b0a12:x=(w-text_w)/2:y=110,"
                    f"drawtext=fontfile={FONT}:text='{q(s['q2'])}':fontsize=74:fontcolor=0xffd47e:borderw=8:bordercolor=0x0b0a12:x=(w-text_w)/2:y=200,"
                    f"drawbox=x=150:y=1500:w=780:h=110:color=0xc0352a@0.95:t=fill:enable='gte(t,{d-3.2:.2f})',"
                    f"drawtext=fontfile={FONT}:text='FULL VIDEO ON THE CHANNEL':fontsize=50:fontcolor=white:x=(w-text_w)/2:y=1528:enable='gte(t,{d-3.2:.2f})'")
              af = f"afade=t=in:d=0.12,afade=t=out:st={d-0.45:.2f}:d=0.45"
              subprocess.run(['ffmpeg', '-y', '-v', 'error', '-i', 'v.mp4', '-ss', str(s['from']), '-to', str(s['to']), '-i', 'mix.wav', '-vf', vf, '-af', af,
                              '-map', '0:v:0', '-map', '1:a:0', '-c:v', 'libx264', '-crf', '19', '-preset', 'medium', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '160k', '-shortest', '-movflags', '+faststart', f"out/{s['name']}.mp4"], check=True)
              print(s['name'], subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'csv=p=0', f"out/{s['name']}.mp4"], capture_output=True, text=True).stdout.strip())
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.project }}-shorts-r${{ github.run_number }}"
          gh release create "$TAG" out/*.mp4 --title "Shorts: ${{ github.event.inputs.project }} (render ${{ github.run_number }})" --notes "Native 9:16 Shorts rendered on GitHub Actions."
          for f in out/*.mp4; do echo "https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename $f)" >> "$GITHUB_STEP_SUMMARY"; done
