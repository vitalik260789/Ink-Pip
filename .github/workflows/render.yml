# Ink & Pip — render a video on many GitHub machines at once.
#   Run: Actions → "Render video" → Run workflow (project = folder in studio/projects, shards = machines, 1–20).
#   1) audio:   music + SFX + voice mix (build/mix.wav)
#   2) render:  every machine renders its own 4-second chunks (render.mjs --resume --shard k/N)
#   3) final:   join chunks, add sound, publish a GitHub Release with the MP4 (public download link)
name: Render video

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder in studio/projects"
        required: true
        default: "day-1-hour"
      shards:
        description: "How many machines render in parallel (1-20)"
        required: true
        default: "12"
      scale:
        description: "Resolution scale (1 = 1080p, 0.5 = 540p preview)"
        required: true
        default: "1"
      chunks:
        description: "Optional: re-render only these 4-second chunks (comma list, e.g. 8,28,39)"
        required: false
        default: ""
      reuse_run:
        description: "Optional: run id whose chunks are reused for everything not re-rendered"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: render-${{ github.event.inputs.project }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      n: ${{ steps.p.outputs.n }}
    steps:
      - id: p
        run: |
          N=${{ github.event.inputs.shards }}
          N=$(( N < 1 ? 1 : (N > 20 ? 20 : N) ))
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq -s, 0 $((N-1)) | sed 's/^/[/;s/$/]/')" >> "$GITHUB_OUTPUT"

  audio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q numpy scipy
      - name: Mix voice + music + SFX
        working-directory: studio
        run: mkdir -p projects/${{ github.event.inputs.project }}/build && python audio/mix.py --project projects/${{ github.event.inputs.project }}
      - uses: actions/upload-artifact@v4
        with:
          name: mix
          path: studio/projects/${{ github.event.inputs.project }}/build/mix.wav
          retention-days: 3

  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install studio
        working-directory: studio
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Render my chunks
        working-directory: studio
        run: node render.mjs --project projects/${{ github.event.inputs.project }} --resume --shard ${{ matrix.shard }}/${{ needs.plan.outputs.n }} --workers 2 --format jpeg --scale ${{ github.event.inputs.scale }} ${{ github.event.inputs.chunks != '' && format('--chunks {0}', github.event.inputs.chunks) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: chunks-${{ matrix.shard }}
          path: studio/projects/${{ github.event.inputs.project }}/build/chunks/c_*.mp4
          retention-days: 3
          if-no-files-found: ignore

  final:
    needs: [plan, render, audio]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Reuse chunks from an earlier run
        if: ${{ github.event.inputs.reuse_run != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: chunks-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.reuse_run }}
          github-token: ${{ github.token }}
          path: studio/projects/${{ github.event.inputs.project }}/build/chunks
      - uses: actions/download-artifact@v4
        with:
          pattern: chunks-*
          merge-multiple: true
          path: new-chunks
      - name: Overlay freshly rendered chunks
        run: mkdir -p studio/projects/${{ github.event.inputs.project }}/build/chunks && cp -f new-chunks/c_*.mp4 studio/projects/${{ github.event.inputs.project }}/build/chunks/ && ls studio/projects/${{ github.event.inputs.project }}/build/chunks | wc -l
      - uses: actions/download-artifact@v4
        with:
          name: mix
          path: studio/projects/${{ github.event.inputs.project }}/build
      - name: Join chunks + add sound
        working-directory: studio
        run: |
          P=projects/${{ github.event.inputs.project }}
          npm install --no-audit --no-fund
          node render.mjs --project $P --concat
          ffmpeg -y -v error -i $P/build/video_silent.mp4 -i $P/build/mix.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart $P/build/final.mp4
          # Metricool rejects very large uploads (a 716 MB file failed, 468 MB worked): re-encode to fit ~420 MB
          SIZE=$(stat -c %s $P/build/final.mp4)
          if [ "$SIZE" -gt 450000000 ]; then
            DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 $P/build/final.mp4)
            VB=$(python3 -c "print(int(420e6*8/float('$DUR')/1000 - 200))")
            echo "final.mp4 is $SIZE bytes -> re-encode video at ${VB}k"
            ffmpeg -y -v error -i $P/build/final.mp4 -c:v libx264 -preset fast -b:v ${VB}k -maxrate $((VB*13/10))k -bufsize $((VB*2))k -pix_fmt yuv420p -c:a copy -movflags +faststart $P/build/final_small.mp4
            mv $P/build/final_small.mp4 $P/build/final.mp4
          fi
          ls -la $P/build/final.mp4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          P=studio/projects/${{ github.event.inputs.project }}
          TAG="${{ github.event.inputs.project }}-r${{ github.run_number }}"
          TITLE=$(python3 -c "import json;print(json.load(open('$P/config.json'))['title'])")
          cp "$P/build/final.mp4" "${{ github.event.inputs.project }}.mp4"
          gh release create "$TAG" "${{ github.event.inputs.project }}.mp4" --title "$TITLE (render ${{ github.run_number }})" --notes "Rendered by GitHub Actions on ${{ needs.plan.outputs.n }} machines. Scale ${{ github.event.inputs.scale }}."
          echo "Download: https://github.com/${{ github.repository }}/releases/download/$TAG/${{ github.event.inputs.project }}.mp4" >> "$GITHUB_STEP_SUMMARY"
